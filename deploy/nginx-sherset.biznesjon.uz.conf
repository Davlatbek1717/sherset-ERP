# /etc/nginx/sites-available/sherset.biznesjon.uz
#
# Reverse proxy in front of the sherset-* PM2 processes:
#   web → 127.0.0.1:4002 (Next.js, prod build)
#   api → 127.0.0.1:4000 (NestJS, prefix /api/v1)
#
# This is an ADDITIVE config — it lives in its own sites-available file
# and only the sherset.biznesjon.uz server_name responds. No other site
# on this VPS is touched.
#
# ⚠️ PORTS: 4000 (api) / 4002 (web) match deploy/ecosystem.sherset.config.cjs.
# If another tenant already occupies these ports on this VPS (e.g. the
# climart deploy uses the same pair), pick a free pair (e.g. 4020/4022)
# and change it in BOTH this file (upstream blocks below) AND the
# ecosystem file (web `-p`, api `API_PORT`) + the production .env
# (API_ORIGIN) so all three stay in sync.
#
# certbot --nginx will append the `listen 443 ssl` block + cert paths
# the first time it runs against this server_name (see DEPLOY notes).

upstream sherset_web {
  server 127.0.0.1:4002;
  keepalive 32;
}

upstream sherset_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name sherset.biznesjon.uz;

  # Generous limit so document attachments + bulk Excel imports go
  # through. Match the API's own multipart limit if you change it.
  client_max_body_size 50m;

  # Compress text responses but leave images / archives alone.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

  # Long-cache the Next.js static asset bundle. Hashed filenames so the
  # cache busts on every build automatically. Declared before location /
  # so the longer prefix wins.
  location /_next/static/ {
    proxy_pass http://sherset_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # API — NestJS already exposes routes under `/api/v1/...`, so we forward
  # the full path through unchanged. SSE (server-sent events) for the
  # realtime notification feed needs disabled buffering.
  location /api/ {
    proxy_pass http://sherset_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE stream support — long-lived connections + no buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Next.js — everything that isn't /api/ or /_next/static/ goes to web.
  location / {
    proxy_pass http://sherset_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
