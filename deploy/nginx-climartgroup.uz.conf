# /etc/nginx/sites-available/climartgroup.uz
#
# Additive reverse proxy for the moysklad-* PM2 processes:
#   web -> 127.0.0.1:4002 (Next.js, prod build)
#   api -> 127.0.0.1:4000 (NestJS, prefix /api/v1)

server {
  listen 80;
  listen [::]:80;
  server_name climartgroup.uz www.climartgroup.uz;

  client_max_body_size 50m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:4002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /_next/static/ {
    proxy_pass http://127.0.0.1:4002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
