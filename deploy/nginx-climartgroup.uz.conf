# /etc/nginx/sites-available/climartgroup.uz
#
# Additive reverse proxy for the moysklad-* PM2 processes:
#   web -> 127.0.0.1:4002 (Next.js, prod build)
#   api -> 127.0.0.1:4000 (NestJS, prefix /api/v1)

server {
  listen 80;
  listen [::]:80;
  server_name climartgroup.uz www.climartgroup.uz;

  client_max_body_size 50m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Kassa (Electron) shell — installer + auto-update channel (F4, spec §8.3).
  # electron-updater's `generic` provider fetches `latest.yml` and
  # `Sherset-Kassa-Setup-<version>.exe` from here. The directory lives
  # OUTSIDE the git checkout on purpose, so `git pull` never touches it.
  #   sudo mkdir -p /var/www/kassa-downloads/desktop
  location /downloads/desktop/ {
    alias /var/www/kassa-downloads/desktop/;
    autoindex off;
    # `.yml` / `.exe` are not in nginx mime.types — force a download, never
    # let a browser try to render them.
    default_type application/octet-stream;
    # `latest.yml` must never be served stale or the update silently lags.
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass http://127.0.0.1:4002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /_next/static/ {
    proxy_pass http://127.0.0.1:4002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
