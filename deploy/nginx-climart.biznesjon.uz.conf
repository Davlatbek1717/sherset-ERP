# /etc/nginx/sites-available/climart.biznesjon.uz
#
# Reverse proxy in front of the moysklad-* PM2 processes:
#   web → 127.0.0.1:4002 (Next.js, prod build)
#   api → 127.0.0.1:4000 (NestJS, prefix /api/v1)
#
# This is an additive config — it lives in its own sites-available
# file and only the climart.biznesjon.uz server_name responds. None
# of the existing 8 sites on this VPS are touched.
#
# certbot --nginx will append the listen 443 ssl block + cert paths
# the first time it runs against this server_name.

upstream moysklad_web {
  server 127.0.0.1:4002;
  keepalive 32;
}

upstream moysklad_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name climart.biznesjon.uz;

  # Generous limit so document attachments + bulk Excel imports go
  # through. Match the API's own multipart limit if you change it.
  client_max_body_size 50m;

  # Compress text responses but leave images / archives alone.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

  # API — NestJS already exposes routes under `/api/v1/...`, so we
  # forward the full path through unchanged. SSE (server-sent events)
  # for the realtime notification feed needs disabled buffering.
  location /api/ {
    proxy_pass http://moysklad_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE stream support — long-lived connections + no buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Kassa (Electron) shell — installer + auto-update channel (F4, spec §8.3).
  # electron-updater's `generic` provider fetches `latest.yml` and
  # `Sherset-Kassa-Setup-<version>.exe` from here. The directory lives
  # OUTSIDE the git checkout on purpose, so `git pull` never touches it.
  #   sudo mkdir -p /var/www/kassa-downloads/desktop
  location /downloads/desktop/ {
    alias /var/www/kassa-downloads/desktop/;
    autoindex off;
    # `.yml` / `.exe` are not in nginx mime.types — force a download, never
    # let a browser try to render them.
    default_type application/octet-stream;
    # `latest.yml` must never be served stale or the update silently lags.
    add_header Cache-Control "no-cache";
  }

  # Next.js — everything that isn't /api/ goes to the web app.
  # The order matters: location /api/ is matched first because it's
  # a longer prefix than location /.
  location / {
    proxy_pass http://moysklad_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Long-cache the Next.js static asset bundle. Hashed filenames so
  # cache-bust on every build is automatic.
  location /_next/static/ {
    proxy_pass http://moysklad_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
