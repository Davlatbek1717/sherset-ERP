server {
    server_name erp.sherset.uz;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kassa (Electron) avtoyangilanish kanali — statik fayllar.
    # Repo TASHQARISIDA turadi: deploy `git reset --hard` qiladi.
    location /downloads/ {
        alias /var/www/kassa-downloads/;
        autoindex off;
        types { text/yaml yml; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # Mahsulot videolari (mijoz-ekran) — statik fayllar, repo TASHQARISIDA
    # (deploy tegmaydi; /downloads/ bilan bir xil naqsh). Range/206 nginx'da
    # tug'ma ishlaydi — <video> tegi uchun shart.
    location /media/ {
        alias /var/www/sherset-media/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.sherset.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.sherset.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = erp.sherset.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name erp.sherset.uz;

    listen 80;
    return 404; # managed by Certbot


}
