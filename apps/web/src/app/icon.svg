       white lightning bolt — the browser-tab favicon for the Climart-branded
       deployment (climartgroup.uz). Served by the Next.js app-router `icon`
       file convention as <link rel="icon" href="/icon.svg">. -->
  <defs>
    <linearGradient id="climart-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DF6"/>
      <stop offset="1" stop-color="#6F5BF5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#climart-g)"/>
  <path fill="#FFFFFF" d="M37 8 L18 37 h10.5 L26 56 L46 26 H35.5 Z"/>
</svg>
