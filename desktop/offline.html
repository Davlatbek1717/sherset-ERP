<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Sherset Kassa — aloqa yo'q</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: Segoe UI, system-ui, sans-serif;
        text-align: center;
      }
      .card { width: 620px; padding: 40px; }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f59e0b;
        display: inline-block;
        margin-right: 10px;
        vertical-align: -2px;
      }
      h1 { font-size: 34px; margin: 0 0 12px; }
      p { color: #94a3b8; font-size: 18px; line-height: 1.6; margin: 0 0 8px; }
      .reason { color: #64748b; font-size: 14px; margin-top: 18px; word-break: break-word; }
      button {
        margin-top: 28px;
        padding: 16px 32px;
        font-size: 18px;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        background: #38bdf8;
        color: #052430;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .hint { margin-top: 28px; font-size: 13px; color: #475569; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="dot"></span>Server bilan aloqa yo'q</h1>
      <p>Kassa do'kon serveriga ulana olmayapti. Internet yoki server o'chgan bo'lishi mumkin.</p>
      <p>Aloqa tiklanishi bilan kassa <b>o'zi</b> qaytadi — hech narsa bosish shart emas.</p>
      <button id="retry" type="button">Hozir qayta urinish</button>
      <div class="reason" id="reason"></div>
      <div class="hint">Chiqish: Ctrl + Alt + Shift + Q</div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const reason = params.get('reason');
      if (reason) document.getElementById('reason').textContent = 'Texnik sabab: ' + reason;

      const button = document.getElementById('retry');
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = 'Tekshirilmoqda...';
        try {
          await window.shersetShell.retry();
        } catch (e) {
          /* qobiq javob bermadi — fon so'rovi baribir davom etadi */
        }
        button.disabled = false;
        button.textContent = 'Hozir qayta urinish';
      });
    </script>
  </body>
</html>
